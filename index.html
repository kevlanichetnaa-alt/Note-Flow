<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProNote | Elegant Workspace</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="light">
  <div class="glass-bg"></div>

  <header>
    <div class="header-content">
       <div class="logo">
          <div class="logo-icon"><i class="fas fa-feather-alt"></i></div>
          <span>ProNote</span>
       </div>
       <div class="search-wrapper">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search your thoughts...">
       </div>
       <div class="header-actions">
         <button id="themeToggle" class="icon-btn"><i class="fas fa-moon"></i></button>
         <button id="addNoteBtn" class="btn-main"><i class="fas fa-plus"></i> <span>New Note</span></button>
       </div>
    </div>
    <div class="filter-bar">
       <button class="filter-chip active" data-cat="All">All</button>
       <button class="filter-chip" data-cat="Work">Work</button>
       <button class="filter-chip" data-cat="Study">Study</button>
       <button class="filter-chip" data-cat="Personal">Personal</button>
       <button class="filter-chip" data-cat="Ideas">Ideas</button>
    </div>
  </header>

  <main id="notesGrid" class="notes-grid"></main>

  <button id="mobileAddBtn" class="fab"><i class="fas fa-plus"></i></button>

  <div id="noteModal" class="modal">
    <div class="modal-content glass">
      <div class="modal-header">
        <input type="text" id="noteTitle" placeholder="Untitled Note" maxlength="50">
        <select id="noteCategory">
             <option value="Personal">Personal</option>
             <option value="Work">Work</option>
             <option value="Study">Study</option>
             <option value="Ideas">Ideas</option>
        </select>
      </div>

      <div class="toolbar">
        <div class="tool-group">
           <button onclick="formatDoc('bold')"><i class="fas fa-bold"></i></button>
           <button onclick="formatDoc('italic')"><i class="fas fa-italic"></i></button>
           <button onclick="formatDoc('underline')"><i class="fas fa-underline"></i></button>
        </div>
        <div class="tool-group">
            <button onclick="formatDoc('insertUnorderedList')"><i class="fas fa-list-ul"></i></button>
            <button onclick="formatDoc('justifyLeft')"><i class="fas fa-align-left"></i></button>
            <button onclick="formatDoc('justifyCenter')"><i class="fas fa-align-center"></i></button>
        </div>
      </div>

      <div id="noteBody" contenteditable="true" data-placeholder="Start typing your brilliance here..."></div>

      <div class="modal-footer">
           <span id="charCount">0 characters</span>
           <div class="footer-btns">
           <button class="btn-secondary close-modal-btn">Cancel</button>
           <button id="saveNoteBtn" class="btn-main">Save Note</button>
           </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
